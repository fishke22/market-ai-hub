schema_version: "W4.1"
protocols:
  w4_ppm_sigmoid_v1:
    method: "SIGMOID"
    method_version: "W4.1_SIGMOID_V1"
    calibration_domain: "PRICE_DISTRIBUTION"
    supported_probability_types: ["TERMINAL", "TOUCH", "FIRST_PASSAGE"]
    sample_origin: "FORWARD_PRECOMMITTED"
    fit_partition_role: "CALIBRATION"
    validation_partition_role: "VALIDATION"
    min_fit_samples: 50
    min_validation_samples: 50
    min_final_oos_samples: 50
    min_class_count: 10
    min_calendar_span_days: 30
    require_zero_overlap_pairs: true
    bootstrap_replicates: 1000
    bootstrap_seed: 20260926
    confidence_level: 0.95
    require_ci_nondegradation: true
    clip_epsilon: 0.000001
    l2_identity_penalty: 0.000001
    max_iterations: 100
    tolerance: 0.0000000001
    acceptance:
      max_brier_delta: 0.0
      max_log_loss_delta: 0.0
      max_ece_delta: 0.0
      require_strict_improvement: true
      strict_improvement_epsilon: 0.000000000001
