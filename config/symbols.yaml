# MARKET_AI_HUB 全球市場代理 symbols — v1 固定清單
# 重要: ^N225 是 Nikkei 225 INDEX，不是 OSE Nikkei 225 micro futures。
# data_grade 統一使用: RESEARCH_PROXY / DELAYED / OFFICIAL_DAILY / BROKER_REALTIME / EXCHANGE_REALTIME
symbols:
  - symbol: "^N225"
    name: "Nikkei 225 Index"
    provider: "yfinance"
    timezone: "Asia/Tokyo"
    asset_type: "index"
    realtime_grade: "DELAYED"
    data_grade: "RESEARCH_PROXY"
    enabled: true
  - symbol: "USDJPY=X"
    name: "USDJPY (primary)"
    provider: "yfinance"
    timezone: "UTC"
    asset_type: "fx"
    realtime_grade: "DELAYED"
    data_grade: "RESEARCH_PROXY"
    enabled: true
