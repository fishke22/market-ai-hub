version: "2026-09-24"
enabled: true
provider: SPARK_SECURITIES_PROFILE
mode: QUOTE_ONLY_PERSISTENT
recording:
  raw_jsonl: false
  normalized_parquet: true
  parquet_flush_seconds: 30
  latest_snapshot_seconds: 1
  subscription_revalidation_seconds: 300
  max_dynamic_subscriptions: 200
  max_buffer_records: 100000
  keep_connection_until_process_exit: true
  logout_after_agent_use: false
  secret_backend: WINDOWS_CREDENTIAL_MANAGER_ONLY
durable_spool:
  enabled: true
  dir: spool
  max_bytes: 268435456
  max_records: 100000
storage:
  root: live/yuanta
  latest_file: latest.json
  status_file: status.json
dynamic_requests:
  enabled: true
  inbox: control/inbox
  processed: control/processed
  failed: control/failed
  allowed_markets: [1, 2, 3, 202, 203, 204, 207, 209, 215]
tick_detail_measurements:
  enabled: false
  timeout_seconds: 5
  max_last_count: 20
  raw_dir: evidence/tick_detail/raw
  evidence_dir: evidence/tick_detail/verification
