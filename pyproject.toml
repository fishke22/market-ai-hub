[project]
name = "market-ai-hub"
version = "0.1.0"
description = "台股 + 大阪日經金融市場研究 MCP Server — 可供任何支援 stdio MCP 的 AI Client 使用，非交易系統"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "yfinance>=0.2.40",
    "mcp>=1.2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "requests>=2.31",
    "pytz>=2024.1",
    "tzdata>=2024.1",
    "chronos-forecasting>=1.3.0",
    "torch>=2.2",
]

[project.optional-dependencies]
timesfm = ["timesfm[torch]>=1.3.0"]
dev = ["pytest>=8.0", "pytest-timeout>=2.2"]

[project.scripts]
market-ai-mcp = "market_ai_hub.mcp.server:main_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_ai_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: 不依賴網路的單元測試",
    "integration: 需要本地資源(duckdb/模型快取)的測試",
    "live: 需要外部網路的測試",
    "optional_model: 需要 GB 級 model weights（clean clone 預設不跑）",
    "optional_integration: 需要外部整合（Yuanta/TradingView/broker）",
    "private_data: 需要 local private data（225LABO 等）",
    "broker_diagnostic: broker 診斷（需本機 SDK/憑證）",
]
addopts = "-m 'not live and not optional_model and not private_data and not broker_diagnostic'"
