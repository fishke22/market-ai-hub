name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lightweight-tests:
    name: Lightweight tests (no GPU, no model weights)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install torch (CPU only)
        run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install runtime dependencies
        run: python -m pip install -r requirements-runtime.txt

      - name: Install project (editable)
        run: python -m pip install -e .

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Import smoke
        run: python -c "import market_ai_hub; from market_ai_hub.services.build_info import build_fingerprint; print('build_id', build_fingerprint()['build_id'])"

      - name: Run lightweight tests (unit only)
        # integration tests need model weights / MCP subprocess; live tests need network.
        # Neither runs in public CI.
        run: python -m pytest tests -q -m "not integration and not live and not optional_model and not optional_integration and not private_data and not broker_diagnostic"
